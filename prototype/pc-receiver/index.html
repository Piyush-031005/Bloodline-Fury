<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLine Fury - Mark 1 Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-layer {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        .title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }
        .status {
            color: #666;
            font-weight: 300;
            letter-spacing: 4px;
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="ui-layer">
        <div class="title">BLOODLINE FURY</div>
        <div class="status" id="status">Awaiting Synchronisation...</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ----------------------------------------------------
        // MARK-1 ENGINE : PHYSICS & ENTITIES
        // ----------------------------------------------------
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            radius: 20,
            color: '#ffffff',
            speed: 1.8,
            friction: 0.88,
            aura: 0
        };

        const effects = [];
        let joystick = { x: 0, y: 0 };

        // ----------------------------------------------------
        // WEBSOCKET LOGIC
        // ----------------------------------------------------
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws;

        function connect() {
            ws = new WebSocket(`${protocol}//${window.location.host}/receiver-ws`);

            ws.onopen = () => {
                statusEl.innerText = 'Neural Link Active';
                statusEl.style.color = '#7a7a7a';
            };

            ws.onclose = () => {
                statusEl.innerText = 'Signal Lost. Retrying...';
                statusEl.style.color = '#aa3333';
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'joystick') {
                    joystick.x = data.value.x;
                    joystick.y = data.value.y;
                } else if (data.type === 'button_down') {
                    triggerCombatAction(data.value);
                }
            };
        }

        // ----------------------------------------------------
        // COMBAT SYSTEM
        // ----------------------------------------------------
        function triggerCombatAction(btn) {
            let dirX = (Math.abs(joystick.x) > 0.1) ? joystick.x : (player.vx !== 0 ? player.vx : 1);
            let dirY = (Math.abs(joystick.y) > 0.1) ? -joystick.y : (player.vy !== 0 ? player.vy : 0);
            
            let mag = Math.hypot(dirX, dirY) || 1;
            dirX /= mag;
            dirY /= mag;

            if (btn === 'X') {
                // LIGHT JAB / DASH (Blue)
                player.vx += dirX * 30;
                player.vy += dirY * 30;
                spawnShockwave(player.x, player.y, '#00bfff', 40);
                spawnParticles(player.x, player.y, '#00bfff', 15);
            } 
            else if (btn === 'Y') {
                // HEAVY SLAM AoE (Red)
                spawnShockwave(player.x, player.y, '#ff3333', 200);
                spawnParticles(player.x, player.y, '#ff3333', 40);
                ctx.translate(Math.random()*16 - 8, Math.random()*16 - 8); // Screen shake
            }
            else if (btn === 'A') {
                // PROJECTILE KICK (Green)
                spawnProjectile(player.x, player.y, dirX, dirY, '#33ff33');
            }
            else if (btn === 'B') {
                // SHIELD BLOCK (Yellow)
                player.aura = 1.0;
                player.vx *= 0.1;
                player.vy *= 0.1;
                spawnShockwave(player.x, player.y, '#ffff33', 60);
            }
        }

        function spawnShockwave(x, y, color, maxRadius) {
            effects.push({ type: 'shockwave', x, y, radius: 10, maxRadius, color, alpha: 1.0 });
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 12 + 5;
                effects.push({
                    type: 'particle', x, y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    radius: Math.random() * 5 + 2, color, alpha: 1.0
                });
            }
        }

        function spawnProjectile(x, y, dirX, dirY, color) {
            effects.push({
                type: 'projectile', x, y,
                vx: dirX * 20, vy: dirY * 20,
                radius: 10, color, alpha: 1.0, life: 60
            });
        }

        // ----------------------------------------------------
        // RENDER LOOP (60 FPS)
        // ----------------------------------------------------
        function loop() {
            ctx.fillStyle = 'rgba(3, 3, 3, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Physics Update
            player.vx += joystick.x * player.speed;
            player.vy -= joystick.y * player.speed; 
            
            player.vx *= player.friction;
            player.vy *= player.friction;
            player.x += player.vx;
            player.y += player.vy;

            // Bounds
            if (player.x < player.radius) { player.x = player.radius; player.vx *= -0.5; }
            if (player.x > canvas.width - player.radius) { player.x = canvas.width - player.radius; player.vx *= -0.5; }
            if (player.y < player.radius) { player.y = player.radius; player.vy *= -0.5; }
            if (player.y > canvas.height - player.radius) { player.y = canvas.height - player.radius; player.vy *= -0.5; }

            if (player.aura > 0) player.aura -= 0.05;

            // Draw Effects
            for (let i = effects.length - 1; i >= 0; i--) {
                let p = effects[i];
                if (p.type === 'shockwave') {
                    p.radius += (p.maxRadius - p.radius) * 0.15;
                    p.alpha -= 0.05;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    if (p.alpha <= 0) effects.splice(i, 1);
                } 
                else if (p.type === 'particle') {
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.9; p.vy *= 0.9;
                    p.alpha -= 0.04;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
                    ctx.fill();
                    if (p.alpha <= 0) effects.splice(i, 1);
                }
                else if (p.type === 'projectile') {
                    p.x += p.vx; p.y += p.vy;
                    p.life--;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (p.life % 2 === 0) spawnParticles(p.x, p.y, p.color, 2);
                    if (p.life <= 0) effects.splice(i, 1);
                }
            }

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 25;
            ctx.shadowColor = player.color;
            ctx.fill();
            
            if (player.aura > 0) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 15, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 51, ${player.aura})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(loop);
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255,255,255';
        }

        connect();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
